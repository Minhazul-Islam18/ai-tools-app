# API (Wasp server) — api.scribegem.com  ->  reverse proxy to 127.0.0.1:3001
# In aaPanel: create site for api.scribegem.com, enable SSL, then add these
# location blocks into its server{} config (Website > Config).

# Stripe webhook needs raw body + larger timeout; proxy_pass keeps body intact.
client_max_body_size 25m;   # raise if S3 uploads proxied through server

location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # websocket / keep-alive support
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
}
