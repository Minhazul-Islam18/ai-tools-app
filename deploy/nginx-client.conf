# Client (static React) — scribegem.com
# In aaPanel: create site for scribegem.com, then paste into its config
# (or set this as the "config file"). Point root at the copied build/ dir.
#
# aaPanel already injects the server{} + SSL block via the panel UI.
# Put the location blocks below INSIDE that server{} (Website > Config).

# root  /www/wwwroot/scribegem.com;   # <- aaPanel site root w/ Wasp client build/
index index.html;

# SPA: serve file if exists, else fall back to index.html
location / {
    try_files $uri $uri/ /index.html;
}

# cache hashed static assets hard
location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# never cache the shell
location = /index.html {
    add_header Cache-Control "no-store";
}
